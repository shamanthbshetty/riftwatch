[package]
name = "riftwatch-native"
version = "0.3.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
