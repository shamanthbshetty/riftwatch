[package]
name = "riftwatch-backend"
version = "0.3.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"
regex = "1"
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
http = "1"
thiserror = "1"
dotenvy = "0.15"
urlencoding = "2.1.3"
base64 = "0.22"
chrono = "0.4"
percent-encoding = "2"

# Debug builds only need line tables for backtraces; full DWARF made every
# binary ~163 MB and incremental state cost another ~0.85 GB per rebuild.
# `incremental = false` trades a little rebuild time for a target dir that
# does not grow with every edit. Run `npm run clean:rust` to prune stale
# hashed binaries (cargo keeps one per past build).
[profile.dev]
debug = 1
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
